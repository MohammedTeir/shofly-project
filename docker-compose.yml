# One host: Postgres + API + bot (long polling). Static apps (Mini App, Admin) are hosted separately over HTTPS.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: production
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]   # put a TLS reverse proxy (Caddy/nginx/host platform) in front; Telegram Mini Apps require HTTPS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      retries: 5
    restart: unless-stopped

  bot:
    build: ./apps/telegram-bot
    env_file: .env
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
